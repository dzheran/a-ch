<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шашки · Checkers</title>
<link rel="manifest" href="manifest.json" id="mf">
<meta name="apple-mobile-web-app-title" content="Шашки">
<meta name="theme-color" content="#6b4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f2ea;--fg:#1c1a17;--bt:#e4dccb;--dk:#6b4a2b;--lt:#e9d7b4;--sel:#1a8f6a}
@media(prefers-color-scheme:dark){:root{--bg:#1a1814;--fg:#f0ead9;--bt:#34302a}}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:18px/1.4 Georgia,serif}
h1{font-size:1.4em;margin:.3em 0}
button,select{font:inherit;padding:12px;margin:4px 0;border-radius:8px;border:1px solid #8a8070;background:var(--bt);color:var(--fg)}
label{display:block;margin:10px 0 2px}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:480px;aspect-ratio:1;margin:8px auto}
.l{background:var(--lt)}
.d{background:var(--dk);border:0;border-radius:0;padding:0;margin:0;position:relative}
.d.sel{outline:5px solid var(--sel);outline-offset:-5px}
.p{position:absolute;inset:12%;border-radius:50%}
.w{background:#f7f3ea;border:3px solid #a39a88}.b{background:#231f1a;border:3px solid #8a8070}
.k::after{content:"♛";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150%;color:#c99a1c}
.row{display:flex;flex-wrap:wrap;gap:6px}.row button{flex:1 1 40%}
[hidden]{display:none!important}
</style></head><body>
<h1 data-i18n="title">Шашки</h1>
<div id="live" role="status" aria-live="polite" style="min-height:2.8em"></div>

<section id="start">
<label for="lang" data-i18n="langLabel">Мова</label>
<select id="lang"><option value="uk">Українська</option><option value="en">English</option></select>
<button id="resume" hidden data-i18n="resume">Продовжити незавершену гру</button>
<label for="var" data-i18n="rules">Правила</label>
<select id="var"><option value="ua" data-i18n="vua">Українські шашки</option><option value="en" data-i18n="ven">Англійські шашки</option><option value="in" data-i18n="vin">Міжнародні шашки (10×10)</option></select>
<label for="col" data-i18n="colour">Ваш колір</label>
<select id="col"><option value="1" data-i18n="cw">Білі</option><option value="-1" data-i18n="cb">Чорні</option><option value="0" data-i18n="cr">Випадково</option></select>
<label for="lvl" data-i18n="lvl">Складність</label>
<select id="lvl"><option value="1" data-i18n="l1">Легка</option><option value="2" selected" data-i18n="l2">Середня</option><option value="3" data-i18n="l3">Сильна</option><option value="4" data-i18n="l4">Дуже сильна (думає близько 2 секунд)</option></select>
<label><input type="checkbox" id="tell"> <span data-i18n="tell">Озвучувати можливі ходи після вибору шашки</span></label>
<button id="go" data-i18n="go">Почати гру</button>
</section>

<section id="game" hidden>
<div id="board" role="group" data-i18n-aria="board" aria-label="Дошка"></div>
<div class="row">
<button id="bLast" data-i18n="bLast">Останній хід</button>
<button id="bUndo" data-i18n="bUndo">Взяти хід назад</button>
<button id="bCancel" data-i18n="bCancel">Скасувати вибір</button>
<button id="bHint" data-i18n="bHint">Підказка</button>
<button id="bMore" aria-expanded="false" data-i18n="bMore">Більше</button>
</div>
<div id="more" hidden class="row">
<button id="bMine" data-i18n="bMine">Мої шашки</button>
<button id="bOpp" data-i18n="bOpp">Шашки суперника</button>
<button id="bMust" data-i18n="bMust">Які шашки б'ють</button>
<button id="bSave" data-i18n="bSave">Зберегти запис партії</button>
<button id="bNew" data-i18n="bNew">Нова гра</button>
</div>
</section>

<script>
const F="abcdefghij",N=i=>F[i%V.size]+(R(i)+1),R=i=>Math.floor(i/V.size);
const D=[[1,1],[1,-1],[-1,1],[-1,-1]],inb=(r,c)=>r>=0&&r<V.size&&c>=0&&c<V.size;
const $=id=>document.getElementById(id);
const VARS={ua:{size:8,rows:3,fly:1,back:1,thru:1,pend:0,max:0,name:"українські",quiet:30},
 en:{size:8,rows:3,fly:0,back:0,thru:0,pend:1,max:0,name:"англійські",quiet:80},
 in:{size:10,rows:4,fly:1,back:1,thru:0,pend:0,max:1,name:"міжнародні",quiet:50}};let V=VARS.ua;
function init(){const S=V.size,b=Array(S*S).fill(0);for(let r=0;r<S;r++)for(let c=0;c<S;c++)if((r+c)%2==0){if(r<V.rows)b[r*S+c]=1;else if(r>=S-V.rows)b[r*S+c]=-1}return b}

/* ---- Правила ---- */
function caps(b,col){const out=[],S=V.size,LAST=col>0?S-1:0;
 for(let i=0;i<S*S;i++){if(b[i]*col<=0)continue;const p=b[i];b[i]=0;
  const dfs=(r,c,king,cap,path)=>{const res=[];
   for(const[dr,dc]of D){if(!king&&!V.back&&dr!=col)continue;const fly=king&&V.fly;let rr=r+dr,cc=c+dc;
    if(fly)while(inb(rr,cc)&&b[rr*S+cc]==0){rr+=dr;cc+=dc}
    if(!inb(rr,cc))continue;const ei=rr*S+cc;
    if(b[ei]*col>=0||cap.includes(ei))continue;
    const L=[];let lr=rr+dr,lc=cc+dc;
    while(inb(lr,lc)&&b[lr*S+lc]==0){L.push(lr*S+lc);if(!fly)break;lr+=dr;lc+=dc}
    if(!L.length)continue;const cap2=cap.concat(ei);
    const opts=L.map(l=>({l,sub:(!king&&V.pend&&R(l)==LAST)?[]:dfs(R(l),l%S,king||(V.thru&&R(l)==LAST),cap2,path.concat(l))}));
    const wc=opts.filter(o=>o.sub.length);
    if(wc.length)wc.forEach(o=>res.push(...o.sub));
    else opts.forEach(o=>res.push({path:path.concat(o.l),cap:cap2}));}
   return res};
  dfs(R(i),i%S,Math.abs(p)==2,[],[i]).forEach(m=>out.push(m));b[i]=p}
 return out}
function moves(b,col){let c=caps(b,col);
 if(c.length){if(V.max){const mx=Math.max(...c.map(m=>m.cap.length));c=c.filter(m=>m.cap.length==mx)}return c}
 const out=[],S=V.size;
 for(let i=0;i<S*S;i++){if(b[i]*col<=0)continue;const k=Math.abs(b[i])==2;
  for(const[dr,dc]of D){if(!k&&dr!=col)continue;let rr=R(i)+dr,cc=i%S+dc;
   while(inb(rr,cc)&&b[rr*S+cc]==0){out.push({path:[i,rr*S+cc],cap:[]});if(!(k&&V.fly))break;rr+=dr;cc+=dc}}}
 return out}
function app(b,m,col){const n=b.slice(),f=m.path[0],t=m.path[m.path.length-1],L=col>0?V.size-1:0;let p=n[f];
 n[f]=0;m.cap.forEach(x=>n[x]=0);
 if(Math.abs(p)==1&&(V.thru?m.path.some(x=>R(x)==L):R(t)==L))p=2*col;
 n[t]=p;return n}

/* ---- Суперник (negamax + alpha-beta) ---- */
function ev(b){let s=0,S=V.size;for(let i=0;i<S*S;i++){const p=b[i];if(!p)continue;const r=R(i);
 s+=p==1?100+r*3:p==2?300:p==-1?-100-(S-1-r)*3:-300}return s}
function ab(b,col,d,a,be){const ms=moves(b,col);if(!ms.length)return -9999-d;if(!d)return col*ev(b);
 let best=-1e9;for(const m of ms){const v=-ab(app(b,m,col),-col,d-1,-be,-a);
  if(v>best)best=v;if(v>a)a=v;if(a>=be)break}return best}
function best(b,col,d,rnd){const sc=moves(b,col).map(m=>({m,v:-ab(app(b,m,col),-col,d-1,-1e9,1e9)}));
 sc.sort((x,y)=>y.v-x.v);
 return Math.random()<rnd?sc[Math.floor(Math.random()*Math.min(3,sc.length))].m:sc[0].m}

/* ---- Дуже сильний рівень ---- */
function ev2(b){const S=V.size,K=V.fly?320:170;let s=0;
 for(let i=0;i<S*S;i++){const p=b[i];if(!p)continue;const r=R(i),c=i%S,w=p>0,a=w?r:S-1-r,
  cen=3-Math.abs(c-(S-1)/2)*.8-Math.abs(r-(S-1)/2)*.4;
  const v=Math.abs(p)==2?K+cen*2:100+a*4+(a==0?7:0)+(a==S-2?6:0)+cen;s+=w?v:-v}
 return s}
function ab2(b,col,d,a,be,ply,st){
 if((++st.n&255)==0&&Date.now()>st.end)st.stop=1;if(st.stop)return 0;
 const ms=moves(b,col);if(!ms.length)return -9000+ply;
 if(d<=0&&(d<-8||!ms[0].cap.length))return col*ev2(b);
 if(ms[0].cap.length)ms.sort((x,y)=>y.cap.length-x.cap.length);
 let best=-1e9;
 for(const m of ms){const v=-ab2(app(b,m,col),-col,d-1,-be,-a,ply+1,st);if(st.stop)return 0;
  if(v>best)best=v;if(v>a)a=v;if(a>=be)break}
 return best}
function strong(b,col,limit){const st={n:0,stop:0,end:Date.now()+limit};let ms=moves(b,col),bm=ms[0];
 if(ms.length<2)return bm;
 for(let d=1;d<=40;d++){let a=-1e9,cur=null;const sc=[];
  for(const m of ms){const v=-ab2(app(b,m,col),-col,d-1,-1e9,-a,1,st);if(st.stop)break;sc.push({m,v});if(v>a){a=v;cur=m}}
  if(st.stop)break;bm=cur;ms=sc.sort((x,y)=>y.v-x.v).map(x=>x.m);if(a>8000)break}
 return bm}

/* ---- Гра ---- */
let G=null,flip=0,MV=[];
const say=t=>{const l=$("live");l.textContent=t+(l.textContent==t?"\u00a0":"")};
const txt=m=>m.path.map(N).join(m.cap.length?":":"-");
const LKEY="shashky-lang";
let LANG=(()=>{try{const x=localStorage.getItem(LKEY);if(x=="uk"||x=="en")return x}catch(e){}return /^uk/i.test(navigator.language||"")?"uk":"en"})();
const L={uk:{title:"Шашки",langLabel:"Мова",resume:"Продовжити незавершену гру",rules:"Правила",vua:"Українські шашки",ven:"Англійські шашки",vin:"Міжнародні шашки (10×10)",
 colour:"Ваш колір",cw:"Білі",cb:"Чорні",cr:"Випадково",lvl:"Складність",l1:"Легка",l2:"Середня",l3:"Сильна",l4:"Дуже сильна (думає близько 2 секунд)",
 tell:"Озвучувати можливі ходи після вибору шашки",go:"Почати гру",board:"Дошка",bLast:"Останній хід",bUndo:"Взяти хід назад",bCancel:"Скасувати вибір",bHint:"Підказка",bMore:"Більше",
 bMine:"Мої шашки",bOpp:"Шашки суперника",bMust:"Які шашки б'ють",bSave:"Зберегти запис партії",bNew:"Нова гра",
 pc:(k,m)=>(k?"дамка ":"шашка ")+(m?"ваша":"суперника"),empty:"порожньо",selected:"обрано",
 canCap:l=>". Можна піти сюди з боєм, буде побито: "+l,can:". Можна піти сюди",cancap:". Цю шашку можна побити",mid:". Проміжна клітинка серії взять",
 vn:v=>({ua:"українські",en:"англійські","in":"міжнародні"})[v],
 start:(v,me,f)=>"Гра почалась, "+t("vn",v)+" шашки. Ви граєте "+(me==1?"білими":"чорними")+(f?". Ваш хід.":". Першим ходить суперник."),
 nomoves:(q,must,mx)=>q+": немає ходів"+(must?". Треба бити: "+must+(mx?". Найбільша серія: "+mx:""):""),
 sel:(q,l)=>"Обрано "+q+(l?". Можна: "+l:""),notmine:(q,h)=>q+": "+(h?"це шашка суперника":"порожньо")+". Оберіть свою шашку",
 bad:(must,mx)=>"Так піти не можна"+(must?". Треба бити"+(mx?" найбільше шашок":""):""),
 lt:d=>(d.me?"Ви":"Суперник")+": "+d.t+(d.n?", взято "+d.n:"")+(d.pr?". "+(d.me?"Ваша шашка стала дамкою":"Шашка суперника стала дамкою")+"!":""),
 over:(l,lost)=>l+". Гру закінчено: "+(lost?"ви програли":"ви перемогли")+".",draw:n=>"Нічия: "+n+" ходів кожного без бою і без ходів шашками.",
 thinking:"Суперник думає…",none:"Ходів ще не було",cancel:"Вибір скасовано",noundo:"Немає що скасовувати",undone:"Хід скасовано",notturn:"Зараз не ваш хід",
 think2:"Думаю…",hint:"Підказка: ",mine:"Ваші. ",opp:"Суперника. ",list:(a,k)=>"Шашки: "+(a||"немає")+". Дамки: "+(k||"немає")+".",
 mustl:l=>"Б'ють: "+l,nomust:"Обов'язкового бою немає",savetitle:"Партія в шашки",saved:"Запис збережено",newg:"Налаштування нової гри",
 resumed:(v,me,l,mine)=>"Гру продовжено, "+t("vn",v)+" шашки. Ви граєте "+(me==1?"білими":"чорними")+". "+l+(mine?" Ваш хід.":"")},
en:{title:"Checkers",langLabel:"Language",resume:"Resume unfinished game",rules:"Rules",vua:"Ukrainian checkers",ven:"English checkers",vin:"International draughts (10×10)",
 colour:"Your colour",cw:"White",cb:"Black",cr:"Random",lvl:"Difficulty",l1:"Easy",l2:"Medium",l3:"Strong",l4:"Very strong (thinks about 2 seconds)",
 tell:"Announce possible moves after selecting a piece",go:"Start game",board:"Board",bLast:"Last move",bUndo:"Take back move",bCancel:"Cancel selection",bHint:"Hint",bMore:"More",
 bMine:"My pieces",bOpp:"Opponent's pieces",bMust:"Which pieces must capture",bSave:"Save game record",bNew:"New game",
 pc:(k,m)=>(m?"your ":"opponent's ")+(k?"king":"piece"),empty:"empty",selected:"selected",
 canCap:l=>". You can move here with a capture; it takes: "+l,can:". You can move here",cancap:". This piece can be captured",mid:". Intermediate square of the capture sequence",
 vn:v=>({ua:"Ukrainian",en:"English","in":"International"})[v],
 start:(v,me,f)=>"Game started, "+t("vn",v)+" rules. You play "+(me==1?"white":"black")+(f?". Your move.":". The opponent moves first."),
 nomoves:(q,must,mx)=>q+": no moves"+(must?". You must capture: "+must+(mx?". Longest sequence: "+mx:""):""),
 sel:(q,l)=>"Selected "+q+(l?". Moves: "+l:""),notmine:(q,h)=>q+": "+(h?"opponent's piece":"empty")+". Select one of your pieces",
 bad:(must,mx)=>"You can't move like that"+(must?". You must capture"+(mx?" the most pieces":""):""),
 lt:d=>(d.me?"You":"Opponent")+": "+d.t+(d.n?", captured "+d.n:"")+(d.pr?". "+(d.me?"Your piece became a king":"The opponent's piece became a king")+"!":""),
 over:(l,lost)=>l+". Game over: "+(lost?"you lost":"you won")+".",draw:n=>"Draw: "+n+" moves each without a capture or a man move.",
 thinking:"The opponent is thinking…",none:"No moves yet",cancel:"Selection cancelled",noundo:"Nothing to undo",undone:"Move taken back",notturn:"It's not your move",
 think2:"Thinking…",hint:"Hint: ",mine:"Yours. ",opp:"Opponent's. ",list:(a,k)=>"Pieces: "+(a||"none")+". Kings: "+(k||"none")+".",
 mustl:l=>"Must capture: "+l,nomust:"No capture is required",savetitle:"Checkers game",saved:"Record saved",newg:"New game settings",
 resumed:(v,me,l,mine)=>"Game resumed, "+t("vn",v)+" rules. You play "+(me==1?"white":"black")+". "+l+(mine?" Your move.":"")}};
const t=(k,...a)=>{const v=L[LANG][k];return typeof v=="function"?v(...a):v};
const LT=()=>G&&G.ld?t("lt",G.ld):"";
let ruleTouched=false;
function applyLang(){document.documentElement.lang=LANG;document.title=t("title");
 $("mf").href=LANG=="en"?"manifest.en.json":"manifest.json";document.querySelector('meta[name="apple-mobile-web-app-title"]').content=t("title");
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)));
 $("lang").value=LANG;if(!ruleTouched)$("var").value=LANG=="en"?"in":"ua";if(G)render()}

function label(i){const p=G.b[i];let s=N(i)+", "+(p?t("pc",Math.abs(p)==2,p*G.me>0):t("empty"));
 if(G.sel===null||G.over||G.turn!=G.me)return s;
 if(i==G.sel)return s+", "+t("selected");
 const ms=MV.filter(m=>m.path[0]==G.sel),to=ms.find(m=>m.path[m.path.length-1]==i);
 if(to)s+=to.cap.length?t("canCap",to.cap.map(N).join(", ")):t("can");
 else if(ms.some(m=>m.cap.includes(i)))s+=t("cancap");
 else if(ms.some(m=>m.path.slice(1,-1).includes(i)))s+=t("mid");
 return s}
function render(){const bd=$("board"),S=V.size;bd.innerHTML="";bd.style.gridTemplateColumns="repeat("+S+",1fr)";MV=G.turn==G.me&&!G.over?moves(G.b,G.me):[];
 for(let k=0;k<S*S;k++){const r=flip?Math.floor(k/S):S-1-Math.floor(k/S),c=flip?S-1-k%S:k%S;
  if((r+c)%2){const d=document.createElement("div");d.className="l";d.setAttribute("aria-hidden","true");bd.append(d);continue}
  const i=r*S+c,p=G.b[i],b=document.createElement("button");
  b.className="d"+(G.sel===i?" sel":"");b.setAttribute("aria-label",label(i));
  if(p){const s=document.createElement("span");s.className="p "+(p>0?"w":"b")+(Math.abs(p)==2?" k":"");b.append(s)}
  b.onclick=()=>click(i);bd.append(b)}}
function startGame(){let me=+$("col").value;if(!me)me=Math.random()<.5?1:-1;
 const v=$("var").value;V=VARS[v];
 G={v,b:init(),turn:v=="en"?-1:1,me,lvl:+$("lvl").value,hist:[],states:[],sel:null,quiet:0,over:false,ld:null,tell:$("tell").checked};
 flip=me==-1?1:0;$("start").hidden=true;$("game").hidden=false;$("more").hidden=true;render();
 say(t("start",G.v,me,G.turn==me));save();
 if(G.turn!=G.me)setTimeout(ai,400)}
function click(i){if(G.over||G.turn!=G.me)return;const b=G.b,all=moves(b,G.me);
 if(b[i]*G.me>0){const ms=all.filter(m=>m.path[0]==i);
  if(!ms.length){const must=all[0].cap.length?[...new Set(all.map(m=>N(m.path[0])))].join(", "):"";
   say(t("nomoves",N(i),must,V.max?all[0].cap.length:0));return}
  G.sel=i;render();
  say(t("sel",N(i),G.tell?[...new Set(ms.map(m=>N(m.path[m.path.length-1])))].join(", "):""));
  setTimeout(()=>{const x=[...document.querySelectorAll(".d")].find(e=>e.classList.contains("sel"));x&&x.focus()},0);return}
 if(G.sel===null){say(t("notmine",N(i),!!b[i]));return}
 const m=all.find(m=>m.path[0]==G.sel&&m.path[m.path.length-1]==i);
 if(!m){say(t("bad",all[0].cap.length>0,V.max));return}
 play(m,"Ви")}
function play(m,who){const col=G.turn,p=G.b[m.path[0]];
 G.states.push({b:G.b,turn:col,hist:G.hist.length,quiet:G.quiet});
 G.b=app(G.b,m,col);G.hist.push(txt(m));
 G.quiet=(m.cap.length||Math.abs(p)==1)?0:G.quiet+1;
 G.turn=-col;G.sel=null;const pr=Math.abs(p)==1&&Math.abs(G.b[m.path[m.path.length-1]])==2;
 G.ld={me:who=="Ви",t:txt(m),n:m.cap.length,pr};
 render();say(LT());check();save();
 if(!G.over&&G.turn!=G.me)setTimeout(ai,400)}
function check(){if(!moves(G.b,G.turn).length){G.over=true;
  say(t("over",LT(),G.turn==G.me))}
 else if(G.quiet>=V.quiet){G.over=true;say(t("draw",V.quiet/2))}}
function ai(){if(!G||G.over)return;if(G.lvl==4)return think();const d=(G.v=="in"?{1:2,2:3,3:5}:{1:2,2:4,3:6})[G.lvl],r={1:.35,2:.1,3:0}[G.lvl];
 play(best(G.b,G.turn,d,r),"Суперник")}
const list=s=>{const a=[],k=[];G.b.forEach((p,i)=>{if(p*s>0)(Math.abs(p)==2?k:a).push(N(i))});
 return t("list",a.join(", "),k.join(", "))};

$("go").onclick=startGame;
$("bLast").onclick=()=>say(LT()||t("none"));
$("bCancel").onclick=()=>{G.sel=null;render();say(t("cancel"))};
$("bUndo").onclick=()=>{const k=G.states.map(s=>s.turn).lastIndexOf(G.me);
 if(k<0){say(t("noundo"));return}
 const s=G.states[k];G.states.length=k;G.b=s.b;G.turn=G.me;G.hist.length=s.hist;G.quiet=s.quiet;
 G.over=false;G.sel=null;G.ld=null;render();say(t("undone"));save()};
$("bHint").onclick=()=>{if(G.over||G.turn!=G.me){say(t("notturn"));return}
 say(t("think2"));setTimeout(()=>say(t("hint")+txt(best(G.b,G.me,G.v=="in"?4:5,0))),30)};
$("bMore").onclick=()=>{const h=$("more").hidden;$("more").hidden=!h;$("bMore").setAttribute("aria-expanded",h)};
$("bMine").onclick=()=>say(t("mine")+list(G.me));
$("bOpp").onclick=()=>say(t("opp")+list(-G.me));
$("bMust").onclick=()=>{const a=moves(G.b,G.me);
 say(a.length&&a[0].cap.length?t("mustl",[...new Set(a.map(m=>N(m.path[0])))].join(", ")):t("nomust"))};
$("bSave").onclick=async()=>{let s="";G.hist.forEach((h,i)=>{s+=(i%2?" ":(i/2+1)+". ")+h+(i%2?"\n":"")});
 try{if(navigator.share){await navigator.share({text:s,title:t("savetitle")});return}}catch(e){}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"}));
 a.download="shashky.txt";a.click();say(t("saved"))};
$("bNew").onclick=()=>{try{$("resume").hidden=!localStorage.getItem(KEY)}catch(e){}G=null;$("game").hidden=true;$("start").hidden=false;say(t("newg"))};

/* ---- Потік для сильного суперника ---- */
const SRC=document.scripts[document.scripts.length-1].textContent;
const ENG=SRC.slice(0,SRC.indexOf("/* ---- Гра ---- */"))+"\nonmessage=e=>{const d=e.data;V=VARS[d.v];postMessage({id:d.id,m:strong(d.b,d.col,d.ms)})};";
let W=null,WID=0;
function think(){const g=G,id=++WID;say(t("thinking"));
 const fin=m=>{if(G!==g||g.over||g.turn==g.me||id!=WID)return;
  const ok=moves(g.b,g.turn).find(x=>x.path.join()==m.path.join()&&x.cap.length==m.cap.length)||best(g.b,g.turn,4,0);play(ok,"Суперник")};
 try{if(!W)W=new Worker(URL.createObjectURL(new Blob([ENG],{type:"text/javascript"})));
  W.onmessage=e=>{if(e.data.id==id)fin(e.data.m)};W.onerror=()=>{W=null;fin(strong(g.b,g.turn,700))};
  W.postMessage({id,v:g.v,b:g.b,col:g.turn,ms:2000})}
 catch(e){setTimeout(()=>fin(strong(g.b,g.turn,700)),50)}}
/* ---- Збереження та офлайн ---- */
const KEY="shashky-save";
function save(){try{if(G&&!G.over)localStorage.setItem(KEY,JSON.stringify(G));else localStorage.removeItem(KEY)}catch(e){}}
function resume(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s)return;G=s;if(!G.v)G.v="ua";V=VARS[G.v];flip=G.me==-1?1:0;
 $("start").hidden=true;$("game").hidden=false;$("more").hidden=true;render();
 say(t("resumed",G.v,G.me,LT(),G.turn==G.me));
 if(G.turn!=G.me)setTimeout(ai,600)}catch(e){}}
$("resume").onclick=resume;
$("var").onchange=()=>{ruleTouched=true};
$("lang").onchange=()=>{LANG=$("lang").value;try{localStorage.setItem(LKEY,LANG)}catch(e){}applyLang()};
applyLang();
try{$("resume").hidden=!localStorage.getItem(KEY)}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
